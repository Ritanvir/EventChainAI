{% extends "base.html" %}
{% block title %}{{ code }} · {{ title }}{% endblock %}
{% block content %}
<section class="section narrow">

    <span>{{ code }}</span>
    <h1>{{ title }}</h1>

  </div>
</section>
{% endblock %}
